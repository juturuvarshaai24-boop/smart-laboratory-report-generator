
name: Hydraulic Pump Leakage Detection CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    name: Code Quality and Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      -      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-api.txt
          pip install ruff

      - name: Run Ruff
        run: ruff check model src scripts tests

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

  docker:
    name: Docker Build and API Test
    runs-on: ubuntu-latest
    needs: ci

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t hydraulic-leakage-api:ci .

      - name: Start container
        run: |
          docker run -d \
            --name hydraulic-api-ci \
            -p 8000:8000 \
            hydraulic-leakage-api:ci

      - name: Test API health
        run: |
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8000/health; then
              exit 0
            fi
            sleep 5
          done
          docker logs hydraulic-api-ci
          exit 1

      - name: Test model information
        run: |
          curl -fsS http://127.0.0.1:8000/model-info -o model-info.json
          python -c "
          import json
          with open('model-info.json') as f:
              data = json.load(f)
          assert data['feature_count'] == 112
          print('Model information verified')
          "

      - name: Stop container
        if: always()
        run: docker rm -f hydraulic-api-ci || true

  deploy:
    name: Deploy to Render
    runs-on: ubuntu-latest
    needs: [ci, docker]

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Trigger Render deployment
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          test -n "$RENDER_DEPLOY_HOOK_URL"
          curl --fail --silent --show-error \
            --request POST \
            "$RENDER_DEPLOY_HOOK_URL"

      - name: Verify Render deployment
        env:
          RENDER_SERVICE_URL: ${{ secrets.RENDER_SERVICE_URL }}
        run: |
          test -n "$RENDER_SERVICE_URL"

          for i in {1..30}; do
            if curl -fsS "$RENDER_SERVICE_URL/health" -o health.json; then
              if grep -q '"status":"healthy"' health.json; then
                echo "Render deployment successful"
                cat health.json
                exit 0
              fi
            fi
            sleep 15
          done

          echo "Render health check failed"
          exit 1
