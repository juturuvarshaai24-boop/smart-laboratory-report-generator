
name: Hydraulic Pump Leakage Detection CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    name: Code Quality and Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-api.txt
          pip install ruff

      - name: Download and verify hydraulic dataset
        run: python scripts/setup_hydraulic_dataset.py

      - name: Run Ruff
        run: ruff check model src scripts tests

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

  stdlib-tests:
    name: Standard Library Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run standard-library tests
        run: python -m unittest discover -s model/tests -v

  prepare-validation-tests:
    name: Data Validation Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install data-validation dependencies
        run: python -m pip install pandas==2.3.3 PyYAML==6.0.3

      - name: Run data-validation tests
        run: python -m unittest model.tests.test_prepare_validation -v

  docker:
    name: Docker Build and API Test
    runs-on: ubuntu-latest
    needs: [ci, stdlib-tests, prepare-validation-tests]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t hydraulic-leakage-api:ci .

      - name: Start container
        run: |
          docker run -d --name hydraulic-api-ci -p 8000:8000 hydraulic-leakage-api:ci

      - name: Test API health
        run: |
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8000/health; then
              exit 0
            fi
            sleep 5
          done
          docker logs hydraulic-api-ci
          exit 1

      - name: Test model information
        run: |
          curl -fsS http://127.0.0.1:8000/model-info -o model-info.json
          python -c "import json; d=json.load(open('model-info.json')); assert d['feature_count']==112; print(d)"

      - name: Stop container
        if: always()
        run: docker rm -f hydraulic-api-ci || true

  deploy:
    name: Deploy to Render
    runs-on: ubuntu-latest
    needs: [ci, stdlib-tests, prepare-validation-tests, docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Trigger Render deployment
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          test -n "$RENDER_DEPLOY_HOOK_URL"
          curl --fail --silent --show-error --request POST "$RENDER_DEPLOY_HOOK_URL"

      - name: Verify Render deployment
        env:
          RENDER_SERVICE_URL: ${{ secrets.RENDER_SERVICE_URL }}
        run: |
          test -n "$RENDER_SERVICE_URL"
          for i in {1..30}; do
            if curl -fsS "$RENDER_SERVICE_URL/health" -o health.json; then
              if grep -q '"status":"healthy"' health.json; then
                cat health.json
                exit 0
              fi
            fi
            sleep 15
          done
          echo "Render health check failed"
          exit 1
